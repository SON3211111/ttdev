# docker compose up -d로 아래 6개 프로그램을 각각 컨테이너로 실행합니다. 로컬 한 사람용 개발 환경입니다.
# 같은 네트워크 안에서는 서비스 이름(mysql/ai 등)으로 서로 접속합니다. 127.0.0.1 포트는 이 PC에서만 접근합니다.

services:
  # 메모 원문을 저장하는 MySQL입니다. 볼륨은 컨테이너 밖의 저장 공간이라 컨테이너를 바꿔도 데이터를 유지합니다.
  # healthcheck가 연결 상태를 검사하고, backend는 MySQL이 healthy가 될 때까지 기다립니다.
  mysql:
    image: mysql:8.0
    container_name: dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:5506:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Java 백엔드입니다. 메모 API와 DB 연결을 담당하고 AI 테스트 요청은 ai 서비스로 보냅니다.
  # depends_on은 시작 순서를 정할 뿐, 이후 AI 장애 때 메모 저장이 AI를 기다리게 하지는 않습니다.
  backend:
    build:
      context: ./backend
    container_name: dev-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/appdb
      DB_PASSWORD: ${MYSQL_PASSWORD}
      AI_SERVER_URL: http://ai:8000
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      ai:
        condition: service_started

  # 프론트 개발 서버입니다. ./frontend:/app은 PC의 폴더를 컨테이너에 연결해 파일 수정이 보이게 합니다.
  # /app/node_modules는 컨테이너 전용 라이브러리 공간으로 PC의 라이브러리와 섞이지 않게 합니다.
  frontend:
    build:
      context: ./frontend
    container_name: dev-frontend
    restart: unless-stopped
    environment:
      API_TARGET: http://backend:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend


  # Python AI 서버입니다. 현재 생성만 제공하며 EMBEDDING_MODEL/QDRANT_URL은 환경 점검 스크립트에서 사용합니다.
  ai:
    build:
      context: ./ai
    container_name: dev-ai
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      AI_MODEL: qwen2.5:1.5b
      EMBEDDING_MODEL: bge-m3
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      - ollama
      - qdrant

  # Qdrant는 AI 검색용 숫자 데이터(벡터)를 보관합니다. 현재 샘플 연결 검증만 했고 실제 기록 연결은 아직입니다.
  # 앞으로도 원문 기준은 MySQL입니다. Qdrant 데이터는 원문에서 다시 만들 수 있어야 합니다.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dev-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:16333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Ollama는 생성/임베딩 모델을 실행합니다. 다운로드한 모델 파일은 전용 볼륨에 보관합니다.
  # 메모리 사용을 줄이려고 동시에 처리하는 요청 수와 로딩 모델 수를 각각 1로 제한합니다.
  ollama:
    image: ollama/ollama:latest
    container_name: dev-ollama
    restart: unless-stopped
    cpus: 4.0
    mem_limit: 4g
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "1m"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mysql_data:
  ollama_data:
  qdrant_data:
