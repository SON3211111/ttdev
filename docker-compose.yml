# t&tech와 향후 AI 검색·생성에 사용할 개발 서비스를 실행합니다.
# 같은 네트워크 안에서는 서비스 이름(sqlserver/ai 등)으로 서로 접속합니다. 127.0.0.1 포트는 이 PC에서만 접근합니다.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: dev-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Next.js는 현재 t&tech 업무 API를 제공합니다.
  backend:
    build:
      context: ./backend-next
    container_name: dev-backend
    restart: unless-stopped
    environment:
      SQLSERVER_HOST: sqlserver
      SQLSERVER_USER: ${SQLSERVER_USER:-sa}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:-${MSSQL_SA_PASSWORD:-}}
      SQLSERVER_TRUST_CERTIFICATE: ${SQLSERVER_TRUST_CERTIFICATE:-true}
      SQLSERVER_AUTO_MIGRATE: ${SQLSERVER_AUTO_MIGRATE:-true}
      TEAM_ORIGIN: ${TEAM_ORIGIN:-http://localhost:5173}
      TEAM_SECURE_COOKIE: ${TEAM_SECURE_COOKIE:-false}
      TEAM_SETUP_TOKEN: ${TEAM_SETUP_TOKEN:-}
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 12

  # 프론트 개발 서버입니다. ./frontend:/app은 PC의 폴더를 컨테이너에 연결해 파일 수정이 보이게 합니다.
  # /app/node_modules는 컨테이너 전용 라이브러리 공간으로 PC의 라이브러리와 섞이지 않게 합니다.
  frontend:
    build:
      context: ./frontend
    container_name: dev-frontend
    restart: unless-stopped
    environment:
      API_TARGET: http://backend:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy


  # Python AI 서버입니다. 현재 생성만 제공하며 EMBEDDING_MODEL/QDRANT_URL은 환경 점검 스크립트에서 사용합니다.
  ai:
    build:
      context: ./ai
    container_name: dev-ai
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      AI_MODEL: qwen2.5:1.5b
      EMBEDDING_MODEL: bge-m3
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      - ollama
      - qdrant

  # Qdrant는 향후 t&tech AI 검색에 사용할 벡터 저장소입니다.
  # 원문은 SQL Server에 저장하며 Qdrant 데이터는 원문에서 재생성할 수 있어야 합니다.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dev-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:16333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Ollama는 생성/임베딩 모델을 실행합니다. 다운로드한 모델 파일은 전용 볼륨에 보관합니다.
  # 메모리 사용을 줄이려고 동시에 처리하는 요청 수와 로딩 모델 수를 각각 1로 제한합니다.
  ollama:
    image: ollama/ollama:latest
    container_name: dev-ollama
    restart: unless-stopped
    cpus: 4.0
    mem_limit: 4g
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "1m"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  sqlserver_data:
  ollama_data:
  qdrant_data:
