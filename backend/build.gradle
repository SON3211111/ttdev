// Gradle은 Java 프로젝트를 빌드/테스트하는 도구입니다. 이 파일에 플러그인과 사용할 라이브러리를 적습니다.
// implementation은 앱에서 쓰는 라이브러리, runtimeOnly는 실행할 때, testImplementation은 테스트할 때 필요합니다.

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹 요청을 받아 Controller로 연결하고 응답을 보내는 기능입니다.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // JPA로 Java 객체를 DB에 저장합니다. MySQL 드라이버가 실제 MySQL 연결을 담당합니다.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Flyway가 서버 시작 시 아직 적용하지 않은 버전 SQL을 순서대로 실행합니다.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 입력값 검증 기능을 제공하는 라이브러리입니다. 현재 기록 규칙은 RecordService에서 직접 검사합니다.
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // JUnit/Spring 테스트 도구와 테스트 전용 메모리 DB(H2)입니다.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'

    implementation 'org.springframework.boot:spring-boot-starter-json'
}

tasks.named('test') {
    useJUnitPlatform()
}
