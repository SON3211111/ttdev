# 테스트 때만 읽는 설정입니다. H2는 메모리에 만드는 임시 DB라 실제 MySQL 기록을 바꾸지 않습니다.
# create-drop은 테스트에서 엔티티를 보고 테이블을 만들고 해당 설정으로 띄운 구성이 종료될 때 지웁니다.
spring.datasource.url=jdbc:h2:mem:memoria;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# H2에서는 MySQL 전용 SQL을 쓰는 Flyway를 끕니다. 따라서 이 테스트 통과만으로 MySQL SQL까지 검증되진 않습니다.
spring.flyway.enabled=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
