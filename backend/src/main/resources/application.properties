# Java 백엔드의 실행 설정입니다. ${...}는 코드에 값을 적지 않고 실행 환경에서 읽는 문법입니다.
# DB 비밀번호는 환경변수로 받고, 테이블 구조 변경은 버전별 SQL을 실행하는 Flyway가 담당합니다.

spring.application.name=backend
server.port=8080

# 로컬 실행 기본 DB 주소입니다. Docker에서는 compose의 DB_URL이 이 주소를 덮어씁니다.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:5506/appdb}
spring.datasource.username=appuser
spring.datasource.password=${DB_PASSWORD}

# JPA는 Java 객체와 DB 행을 연결하는 기능입니다. validate는 테이블을 바꾸지 않고 엔티티와 맞는지만 검사합니다.
# 이미 적용한 V1 SQL을 고치면 Flyway의 변경 검사가 실패합니다. 구조 변경은 V2 같은 새 파일로 추가합니다.
spring.jpa.hibernate.ddl-auto=validate
# 응답을 만드는 동안 DB를 뒤늦게 읽지 않게 합니다. 필요한 조회는 Service 안에서 끝냅니다.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# 경험 날짜(recordDate)는 날짜 그대로 저장하고, 생성/수정 시각은 세계 표준 시각(UTC)으로 맞춥니다.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# 기존 테이블을 확인 없이 초기 버전으로 간주하지 않습니다.
spring.flyway.baseline-on-migrate=false
# JSON에 정의되지 않은 필드가 오면 거부합니다. 예: 수정 요청에 recordType을 몰래 넣는 경우.
spring.jackson.deserialization.fail-on-unknown-properties=true
